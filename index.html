<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GripSense — Caretaker Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>GRIPSENSE</h1>
            <p class="subtitle">Caretaker Dashboard</p>
        </div>
        <div class="header-right">
            <span id="connection" class="connection offline" hidden>Not connected</span>
            <div id="user-area" class="user-area" hidden>
                <span id="user-email" class="user-email"></span>
                <button id="logout-button" type="button" class="button-secondary">Log out</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div id="checking-view" class="status" role="status">
            <p>Loading...</p>
        </div>

        <section id="login-view" class="login-card" hidden>
            <h2>Caretaker Login</h2>
            <form id="login-form" novalidate>
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="username" required>

                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" required>

                <p id="login-error" class="login-error" role="alert" hidden></p>

                <button id="login-button" type="submit" class="button-primary">Login</button>
            </form>
        </section>

        <div id="dashboard-view" hidden>
            <section class="patient-card">
                <form id="patient-form" novalidate>
                    <label for="patient-name">Patient Name</label>
                    <div class="patient-row">
                        <input id="patient-name" type="text" maxlength="50" autocomplete="off">
                        <button id="patient-save" type="submit" class="button-save">Save</button>
                    </div>
                    <p id="patient-feedback" class="form-feedback" role="status" hidden></p>
                </form>
            </section>

            <div id="notices"></div>

            <div id="status" class="status" role="status" aria-live="polite"></div>

            <section id="latest" hidden aria-live="assertive">
                <h2>Latest Patient Alert</h2>
                <div id="latest-card" class="latest-card"></div>
            </section>

            <section id="history" hidden>
                <h2>Event History</h2>
                <ol id="history-list" class="history-list"></ol>
            </section>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
